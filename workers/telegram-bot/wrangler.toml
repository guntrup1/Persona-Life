name = "telegram-audio-worker"
main = "src/index.ts"
compatibility_date = "2024-04-05"

[observability]
enabled = true

# ── SECRETS (set via `wrangler secret put`, NEVER commit) ──
#   wrangler secret put TELEGRAM_BOT_TOKEN
#   wrangler secret put WORKER_SECRET_TOKEN
# WORKER_SECRET_TOKEN must match the WORKER_SECRET_TOKEN env var in the Render service.
# RENDER_APP_URL is public (not a secret) and stays as a var.

[vars]
RENDER_APP_URL = "https://persona-life-mw90.onrender.com"