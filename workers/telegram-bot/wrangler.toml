name = "telegram-audio-worker"
main = "src/index.ts"
compatibility_date = "2024-04-05"

[observability]
enabled = true

# ── Secrets ──────────────────────────────────────────────────────────────────
# NEVER commit secret values here. Set them as Cloudflare secrets instead:
#   wrangler secret put TELEGRAM_BOT_TOKEN
#   wrangler secret put WORKER_SECRET_TOKEN
#   wrangler secret put WEBHOOK_SECRET_TOKEN
# (wrangler secrets override vars of the same name.)
# The old token values are in git history and MUST be rotated (see audit).

[vars]
RENDER_APP_URL = "https://persona-life-mw90.onrender.com"