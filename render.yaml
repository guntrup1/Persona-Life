services:
  - type: web
    name: life-os
    runtime: docker
    plan: free
    autoDeploy: true
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: USE_WEBHOOK
        value: "true"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: WORKER_SECRET_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: APP_URL
        value: https://persona-life-mw90.onrender.com
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        value: https://persona-life-mw90.onrender.com/api/auth/google/callback
