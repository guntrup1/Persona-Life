name: nightly-backup
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install deps
        run: npm ci --no-audit --no-fund --ignore-scripts

      - name: Run backup dump
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: node node_modules/tsx/dist/cli.mjs script/backup.ts

      - name: Install aws cli
        run: |
          python3 -m pip install --user --quiet awscli
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Upload to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT }}
        run: |
          aws s3 sync backups/ s3://${{ secrets.R2_BUCKET }}/persona-life-backups/ --delete

      - name: Prune backups older than 30 days
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT }}
        run: |
          cutoff=$(date -d "30 days ago" +%Y-%m-%d)
          aws s3 ls s3://${{ secrets.R2_BUCKET }}/persona-life-backups/ --recursive | awk -v c="$cutoff" '$1 < c {print $4}' | xargs -r -n 50 aws s3 rm s3://${{ secrets.R2_BUCKET }}/persona-life-backups/ --quiet